# Direct RSS/Atom feeds. Verified 27 Sep 2026 (see docs/sources.md).
#
# Fields:
#   id        unique, lowercase-with-dashes (becomes the engine's feed id)
#   name      display name
#   url       feed URL
#   type      official | national_media | regional_media | legal_media | social | manual
#   language  ISO 639-1 code of most items
#   prior     0-30 relevance bonus for feeds that are already on-topic (education sections, official)
#   sector    optional hint when the whole feed is about one sector
#   enabled   default true
#   max_age_days  optional per-feed freshness override (engine setting)

