# India gazetteer: 28 states + 8 union territories.
# code  = ISO 3166-2:IN subdivision code without the "IN-" prefix (2023 revision: CG, OD, TG, UK).
# names = the state's own names (English, Hindi and the state's main language); strong signal.
# cities = capitals, major cities and district HQs; they imply the state (weaker signal).
# weak  = names that often appear only as datelines (e.g. "New Delhi") and need another signal.
# Extend a state by adding names or cities; add a country as a new file in this folder.

country: IN
