# Actors: bodies and institutions that make the news. Used for the "actor" tag, for geography
# (a High Court implies its state) and as relevance signals. `sector` links a body to a sector.
# Same matching rules as sectors.yaml (ALL-CAPS acronyms are case-sensitive).

actors:
  # --- Central ministries and departments --------------------------------------------------
  - {id: moe, label: Ministry of Education, type: ministry, sector: [school_education, higher_education],
     aliases: ["Ministry of Education", "Education Ministry", "Union Education Minister", "MoE", "शिक्षा मंत्रालय", "केंद्रीय शिक्षा मंत्री"]}
  - {id: msde, label: Ministry of Skill Development and Entrepreneurship, type: ministry, sector: [skill_development],
     aliases: [MSDE, "Skill Development Ministry", "Ministry of Skill Development", "कौशल विकास मंत्रालय"]}
  - {id: dopt, label: Department of Personnel and Training, type: ministry,
     aliases: [DoPT, "Department of Personnel", "Appointments Committee of the Cabinet", ACC, "कार्मिक मंत्रालय"]}
  - {id: pib, label: Press Information Bureau, type: ministry, aliases: [PIB]}

