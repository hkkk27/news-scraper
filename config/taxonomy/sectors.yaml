# Sectors tracked by this profile.
# Add a sector (e.g. healthcare) by adding a block here; it appears in tags, filters and reports.
#
# Matching rules (tracker/taxonomy.py):
#   - Latin-script terms match whole words, case-insensitively.
#   - ALL-CAPS acronyms (e.g. CBSE, ITI) match case-sensitively, so "iti" inside words never counts.
#   - Indic-script terms match as substrings (word boundaries are unreliable with matras).
#   - "strong" terms are unambiguous signals and weigh more than "terms".

sectors:
  school_education:
    label: School education
    strong:
      en: [CBSE, ICSE, CISCE, NCERT, SCERT, NIOS, "Samagra Shiksha", "PM SHRI", "PM POSHAN", "mid-day meal",
           "board exam", "board exams", "board results", "Class 10", "Class 12", "Class X", "Class XII",
           "school education", "school teachers", "teacher recruitment", "Right to Education", "RTE Act",
           UDISE, "NIPUN Bharat", "Kendriya Vidyalaya", "Navodaya Vidyalaya", KVS, NVS, "government schools",
           "private schools", "school fees", "SSC exam", "HSC exam", TET, CTET]
      hi: ["विद्यालय", "सरकारी स्कूल", "बोर्ड परीक्षा", "मध्याह्न भोजन", "मिड-डे मील", "शिक्षक भर्ती", "समग्र शिक्षा",
