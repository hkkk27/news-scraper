      ta: ["பள்ளி", "பள்ளிக்கல்வி", "அரசுப் பள்ளி", "பொதுத்தேர்வு"]
      te: ["పాఠశాల", "పాఠశాలలు"]
      bn: ["বিদ্যালয়", "মাধ্যমিক"]
      gu: ["શાળા"]
      kn: ["ಶಾಲೆ"]
      ml: ["സ്കൂൾ"]
    terms:
      en: [school, schools, student, students, pupils, teacher, teachers, classroom, textbook, textbooks,
           curriculum, syllabus, enrolment, enrollment, dropout, "foundational literacy", anganwadi, "pre-primary",
