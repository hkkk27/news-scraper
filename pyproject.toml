[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-tracker"
version = "0.1.0"
description = "News & election intelligence tracker: collect, de-duplicate, score, tag and report sector news by state."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Harshit Singh" }]
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "rapidfuzz>=3.9",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "langdetect>=1.0.9",
    "python-dateutil>=2.9",
    "SQLAlchemy>=2.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
embeddings = ["model2vec>=0.4"]

[project.scripts]
tracker = "tracker.cli:main"

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.setuptools.package-data]
tracker = ["templates/*", "site_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
