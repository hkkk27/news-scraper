name: tracker

# One workflow for every scheduled job. All jobs share one concurrency group, because the
# SQLite database is saved back to the `data` branch and must never be written twice at once.
# Built around one reader's morning: collect the evening before and early morning, then score
# (rules + model + free AI) and deliver the brief to Telegram before 10:00 IST.
on:
  schedule:
    - cron: "0 13 * * *"     # 18:30 IST: evening sweep (feeds that only keep a few hours of items)
    - cron: "0 1 * * *"      # 06:30 IST: early-morning sweep
    - cron: "0 4 * * *"      # 09:30 IST: final sweep + AI scoring + daily brief PDF on Telegram (~09:45)
    - cron: "30 4 * * 1"     # Monday 10:00 IST: weekly brief + Excel on Telegram
    - cron: "40 21 * * *"    # 03:10 IST: retrain the relevance model from the day's feedback
  workflow_dispatch:
    inputs:
      task:
        description: "daily = collect + send the brief to Telegram · run = collect + update the website only"
        type: choice
        options: [daily, run, weekly, train]
        default: daily

concurrency:
  group: tracker-data
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  tracker:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 on 19 Oct, mid-run
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
      REPORT_EMAIL_TO_EXEC: ${{ secrets.REPORT_EMAIL_TO_EXEC }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Pick the task
        id: task
        run: |
          case "${{ github.event.schedule }}" in
            "0 4 * * *")   task=daily ;;
            "30 4 * * 1")  task=weekly ;;
            "40 21 * * *") task=train ;;
            "")            task="${{ inputs.task || 'run' }}" ;;
            *)             task=run ;;
          esac
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "Running task: $task"

      - name: Fonts for Indian scripts in the PDF brief
        if: steps.task.outputs.task == 'daily' || steps.task.outputs.task == 'weekly'
        run: sudo apt-get update -q >/dev/null && sudo apt-get install -y -q fonts-noto-core >/dev/null

      - name: Restore data
        run: bash scripts/data_branch.sh restore

      - name: Run
        run: |
          case "${{ steps.task.outputs.task }}" in
            run)    python -m tracker run ;;
            daily)  python -m tracker run && python -m tracker report daily --send ;;
            weekly) python -m tracker report weekly --send ;;
            train)  python -m tracker train && python -m tracker process ;;
          esac

      - name: Save data
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/data_branch.sh save

      - name: Package the dashboard for GitHub Pages
        if: always() && hashFiles('output/site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/site

      - name: Upload reports, dashboard and a database backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-output-${{ github.run_id }}
          path: |
            output/
            data/tracker.db
          retention-days: 14
          if-no-files-found: ignore

      # Optional: publish the dashboard to Cloudflare Pages (put Cloudflare Access in front of it
      # for email login). Skipped unless all three secrets exist.
      - name: Check Cloudflare config
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_PROJECT_NAME" ] && [ -f output/site/index.html ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy dashboard
        if: steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy output/site --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}

  # Public dashboard on GitHub Pages (needs a public repository and Settings → Pages → Source:
  # "GitHub Actions"). Allowed to fail, so a repository without Pages still shows green runs.
  pages:
    needs: tracker
    if: always() && needs.tracker.result != 'cancelled'
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
