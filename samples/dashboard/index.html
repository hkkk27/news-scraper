<style>

    }

    color-scheme: dark;
    --bg: #15181E; --surface: #1D2129; --ink: #ECEAE4; --ink-2: #C3C2B7; --muted: #9AA0AA; --rule: #333945;
    --accent: #F08A55; --accent-soft: #3A2A22; --cat-soft: #1F3336; --cat-ink: #9ED6DB; --core: #ECEAE4; --core-ink: #15181E;

  body { margin: 0; background: var(--bg); color: var(--ink);

  .updated { color: var(--muted); font-size: 13px; }

  .card h3 { margin: 0 0 8px; font-size: 14px; }

  .bars .lab { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars .track { position: relative; height: 16px; }

  .bars .val { position: absolute; top: 0; font-size: 12px; color: var(--ink-2); padding-left: 6px; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--ink-2); margin: 4px 0 8px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
  svg text { fill: var(--muted); font-size: 11px; }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 6px;

  table.runs th { color: var(--muted); font-weight: 600; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const LANG = {en: "English", hi: "Hindi", mr: "Marathi", ta: "Tamil", te: "Telugu", bn: "Bengali", gu: "Gujarati", ml: "Malayalam", pa: "Punjabi", kn: "Kannada", or: "Odia"};
const BANDS = {core: ["core"], relevant: ["core", "relevant"], peripheral: ["core", "relevant", "peripheral"]};
const store = {
  get(k, d) { try { const v = localStorage.getItem("tracker:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tracker:" + k, JSON.stringify(v)); } catch {} },
};
const state = Object.assign({days: 7, band: "relevant", sector: "", st: "", cat: "", lang: "", q: "", tab: "feed", shown: 40},
                            store.get("filters", {}), {q: "", shown: 40});
const now = DATA ? new Date(DATA.generated_iso) : new Date();

function inPeriod(s, days) { return (now - new Date(s.d)) <= days * 864e5; }
function filtered(extra = {}) {
  const f = Object.assign({}, state, extra);
  const q = f.q.trim().toLowerCase();
  return DATA.stories.filter(s => inPeriod(s, f.days) && BANDS[f.band].includes(s.b)
    && (!f.sector || (f.sector === "_gov" ? !s.sec.length : s.sec.includes(f.sector)))
    && (!f.st || (f.st === "_nat" ? !s.st.length : s.st.includes(f.st)))
    && (!f.cat || s.c === f.cat) && (!f.lang || s.lg === f.lang)
    && (!q || s.t.toLowerCase().includes(q) || (s.s || "").toLowerCase().includes(q)));
}
const where = s => s.st.length ? s.st.map(c => DATA.states[c] || c).join(", ") : "National";

function card(s) {
  const title = s.u ? `<a class="t" href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>` : `<b>${esc(s.t)}</b>`;
  const sectors = s.sec.map(x => DATA.sectors[x] || x).join(", ");
  const badges = (s.p === "high" ? `<span class="badge b-high">HIGH</span>` : "")
    + (s.b === "core" ? `<span class="badge b-core">CORE ${s.sc}</span>` : "")
    + `<span class="badge b-cat">${esc((DATA.categories[s.c] || s.c).toUpperCase())}</span>`;
  const outlets = s.o > 1 ? ` · reported by ${s.o} outlets` : "";
  const lang = s.lg !== "en" ? ` · ${esc(LANG[s.lg] || s.lg)}` : "";
  const why = s.why && s.why.length ? `<details class="why"><summary>Why this score (${s.sc}, by ${esc(s.by)})</summary>${esc(s.why.join("; "))}</details>` : "";
  return `<article class="story">${title}<div class="meta">${badges}${esc(where(s))}${sectors ? " · " + esc(sectors) : ""} · ${esc(s.s)}${outlets}${lang}</div>${why}</article>`;
}

function renderKpis() {
  const p = filtered({sector: "", st: "", cat: "", lang: "", q: ""});
  const n = c => p.filter(s => s.c === c).length;
  const tiles = [[p.length, "stories"], [p.filter(s => s.b === "core").length, "core"], [p.filter(s => s.p === "high").length, "high priority"],
                 [n("transfer"), "transfers"], [n("election"), "elections"], [n("court"), "court rulings"]];
  $("#kpis").innerHTML = tiles.map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l} · ${state.days === 1 ? "today" : state.days + " days"}</span></div>`).join("");
}

function renderList(list) {
  const shown = list.slice(0, state.shown);
  return `<p class="count">${list.length} ${list.length === 1 ? "story" : "stories"}</p>`
    + (shown.length ? shown.map(card).join("") : `<p class="empty">Nothing matches these filters.</p>`)
    + (list.length > shown.length ? `<button class="more" id="more" type="button">Show more (${list.length - shown.length} left)</button>` : "");
}

function barChart(title, rows, label = "stories") {
  if (!rows.length) return `<div class="card"><h3>${esc(title)}</h3><p class="empty">No data</p></div>`;
  const max = Math.max(...rows.map(r => r[1]));
  return `<div class="card"><h3>${esc(title)}</h3><div class="bars">` + rows.map(([k, v]) =>
    `<div class="lab" title="${esc(k)}">${esc(k)}</div><div class="track"><div class="bar" style="width:${Math.max(1, 88 * v / max)}%" data-tip="${esc(k)}: ${v} ${label}"></div><span class="val" style="left:${Math.max(1, 88 * v / max)}%">${v}</span></div>`
  ).join("") + `</div></div>`;
}

function counts(list, keyFn) {
  const m = new Map();
  list.forEach(s => keyFn(s).forEach(k => m.set(k, (m.get(k) || 0) + 1)));
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}

function trendChart(list) {
  const days = Math.max(7, state.days);
  const buckets = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now - i * 864e5); const key = d.toISOString().slice(0, 10);
    buckets.push({key, label: d.toLocaleDateString("en-IN", {day: "numeric", month: "short"}), core: 0, rel: 0});
  }
  const idx = Object.fromEntries(buckets.map((b, i) => [b.key, i]));
  list.forEach(s => { const i = idx[s.d.slice(0, 10)]; if (i !== undefined) { if (s.b === "core") buckets[i].core++; else buckets[i].rel++; } });
  const W = 640, H = 180, pad = 28, bw = (W - pad) / buckets.length;
  const max = Math.max(1, ...buckets.map(b => b.core + b.rel));
  const y = v => (H - 34) * v / max;
  let bars = "";
  buckets.forEach((b, i) => {
    const x = pad + i * bw + 2, w = Math.max(2, bw - 4), hc = y(b.core), hr = y(b.rel);
    const base = H - 20;
    const tip = `${b.label}: ${b.core} core, ${b.rel} other relevant`;
    if (b.core) bars += `<rect x="${x}" y="${base - hc}" width="${w}" height="${hc}" fill="var(--series-2)" rx="${b.rel ? 0 : 3}" data-tip="${esc(tip)}"/>`;
    if (b.rel) bars += `<rect x="${x}" y="${base - hc - hr - (b.core ? 2 : 0)}" width="${w}" height="${hr}" fill="var(--series-1)" rx="3" data-tip="${esc(tip)}"/>`;
    bars += `<rect x="${x - 2}" y="0" width="${bw}" height="${base}" fill="transparent" data-tip="${esc(tip)}"/>`;
    if (i % Math.ceil(buckets.length / 7) === 0) bars += `<text x="${x}" y="${H - 4}">${esc(b.label)}</text>`;
  });
  const grid = [0.5, 1].map(f => { const gy = H - 20 - (H - 34) * f; return `<line x1="${pad}" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--grid)"/><text x="0" y="${Math.max(10, gy + 4)}">${Math.round(max * f)}</text>`; }).join("");
  const table = `<table class="runs" hidden id="trend-table"><tr><th>Day</th><th>Core</th><th>Other relevant</th></tr>${buckets.map(b => `<tr><td>${esc(b.label)}</td><td>${b.core}</td><td>${b.rel}</td></tr>`).join("")}</table>`;
  return `<div class="card"><h3>Relevant stories per day</h3>
    <div class="legend"><span><span class="sw" style="background:var(--series-2)"></span>Core</span><span><span class="sw" style="background:var(--series-1)"></span>Other relevant</span>
    <button class="linkbtn" type="button" id="toggle-table">Show as table</button></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Relevant stories per day, core and other">${grid}<line x1="${pad}" x2="${W}" y1="${H - 20}" y2="${H - 20}" stroke="var(--rule)"/>${bars}</svg>${table}</div>`;
}

function renderInsights() {
  const list = filtered();
  const rel = list.filter(s => s.b !== "peripheral");
  return `<div class="grid2">${trendChart(filtered({days: Math.max(state.days, 7)}).filter(s => s.b !== "peripheral"))}
    ${barChart(`By state / UT (top 12) · plus ${rel.filter(s => !s.st.length).length} national`, counts(rel.filter(s => s.st.length), s => s.st.map(c => DATA.states[c] || c)).slice(0, 12))}
    ${barChart("By sector", counts(rel, s => s.sec.length ? s.sec.map(x => DATA.sectors[x] || x) : ["Governance only"]))}
    ${barChart("By category", counts(rel, s => [DATA.categories[s.c] || s.c]))}
    ${barChart("By language", counts(rel, s => [LANG[s.lg] || s.lg]))}
    ${barChart("Who decided the score", counts(list, s => [s.by]), "items")}</div>
    <p class="count">${DATA.labels} feedback labels so far. Train the model by tapping 👍 / 👎 on Telegram cards.</p>`;
}

function renderRuns() {
  const runs = DATA.runs;
  const ok = runs.filter(r => r.status === "ok").length;
  const times = runs.filter(r => r.status === "ok").map(r => new Date(r.started_at)).sort((a, b) => a - b);
  let gap = 0; for (let i = 1; i < times.length; i++) gap = Math.max(gap, (times[i] - times[i - 1]) / 36e5);
  return `<p class="count">${ok}/${runs.length} runs succeeded in the last ${esc(String(Math.round((now - new Date(runs.at(-1)?.started_at || now)) / 864e5)))} days · longest gap between successful runs: ${gap.toFixed(1)} h</p>
    <div class="card" style="overflow-x:auto"><table class="runs"><tr><th>Started (UTC)</th><th>Mode</th><th>Items</th><th>New</th><th>Relevant</th><th>Status</th></tr>
    ${runs.slice(0, 120).map(r => `<tr><td>${esc(r.started_at.replace("T", " ").replace("Z", ""))}</td><td>${esc(r.mode)}</td><td>${r.items_seen}</td><td>${r.items_new}</td><td>${r.relevant}</td><td class="${r.status === "ok" ? "ok" : "bad"}">${esc(r.status)}</td></tr>`).join("")}</table></div>`;
}

function render() {
  store.set("filters", {days: state.days, band: state.band, sector: state.sector, st: state.st, cat: state.cat, lang: state.lang, tab: state.tab});
  document.querySelectorAll("[data-days]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.days === state.days)));
  document.querySelectorAll("[data-band]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.band === state.band)));
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  renderKpis();
  const view = $("#view");
  if (state.tab === "insights") view.innerHTML = renderInsights();
  else if (state.tab === "runs") view.innerHTML = renderRuns();
  else view.innerHTML = renderList(state.tab === "feed" ? filtered() : filtered({cat: state.tab}));
  const more = $("#more"); if (more) more.onclick = () => { state.shown += 40; render(); };
  const tt = $("#toggle-table"); if (tt) tt.onclick = () => { const t = $("#trend-table"); t.hidden = !t.hidden; tt.textContent = t.hidden ? "Show as table" : "Hide table"; };
}

function fillSelect(id, label, entries) {
  $(id).innerHTML = `<option value="">${label}</option>` + entries.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("");
}

function init() {
  if (!DATA) { $("#view").innerHTML = `<p class="empty">No data embedded. Run <code>python -m tracker site</code>.</p>`; return; }
  $("#title").textContent = DATA.profile;
  $("#updated").textContent = "Updated " + DATA.generated;
  const present = (fn) => new Set(DATA.stories.flatMap(fn));
  const states = present(s => s.st);
  fillSelect("#f-sector", "All sectors", [...Object.entries(DATA.sectors), ["_gov", "Governance only"]]);
  fillSelect("#f-state", "All states", [["_nat", "National"], ...Object.entries(DATA.states).filter(([c]) => states.has(c)).sort((a, b) => a[1].localeCompare(b[1]))]);
  fillSelect("#f-cat", "All categories", Object.entries(DATA.categories));
  fillSelect("#f-lang", "All languages", [...present(s => [s.lg])].map(l => [l, LANG[l] || l]));
  const bind = (id, key) => { const el = $(id); el.value = state[key]; el.oninput = () => { state[key] = el.value; state.shown = 40; render(); }; };
  bind("#f-sector", "sector"); bind("#f-state", "st"); bind("#f-cat", "cat"); bind("#f-lang", "lang"); bind("#f-q", "q");
  document.querySelectorAll("[data-days]").forEach(b => b.onclick = () => { state.days = +b.dataset.days; state.shown = 40; render(); });
  document.querySelectorAll("[data-band]").forEach(b => b.onclick = () => { state.band = b.dataset.band; state.shown = 40; render(); });
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.shown = 40; render(); });
  const theme = store.get("theme", "");
  if (theme) document.documentElement.dataset.theme = theme;
  $("#theme").onclick = () => {
    const dark = getComputedStyle(document.documentElement).colorScheme === "dark";
    document.documentElement.dataset.theme = dark ? "light" : "dark"; store.set("theme", document.documentElement.dataset.theme);
  };
  const tip = $("#tip");
  document.addEventListener("pointermove", e => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if (!t) { tip.style.opacity = 0; return; }
    tip.textContent = t.dataset.tip; tip.style.opacity = 1;
    tip.style.left = Math.min(window.innerWidth - 250, e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px";
  });
  render();
}
init();
</script>
